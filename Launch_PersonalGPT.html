<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Opening PersonalGPT...</title>
  <meta http-equiv="refresh" content="1; url=http://localhost:8000">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      max-width: 480px;
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
    .cloud-btn {
      background: #0ea5e9;
      margin-top: 0.75rem;
    }
    .cloud-btn:hover { background: #0284c7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Launching PersonalGPT</h1>
    <p>Redirecting to your active PersonalGPT instance at <strong>http://localhost:8000</strong>...</p>
    <a href="http://localhost:8000" class="btn">Open Local App</a>
    <br><br>
    <a href="https://codespaces.new/Manokrithik/Personal-gpt" class="btn cloud-btn">Launch in Cloud (Codespaces)</a>
  </div>
</body>
</html>
