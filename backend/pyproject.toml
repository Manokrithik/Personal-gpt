[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personalgpt-backend"
version = "0.1.0"
description = "PersonalGPT - Private, Modular, Extensible Personal AI Assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PersonalGPT Team" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]
