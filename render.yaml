services:
  - type: web
    name: personal-gpt
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: DEFAULT_MODEL
        value: gemini-1.5-flash
      - key: ENABLE_MEMORY
        value: "true"
      - key: ENABLE_RAG
        value: "true"
      - key: ENABLE_TOOLS
        value: "true"
